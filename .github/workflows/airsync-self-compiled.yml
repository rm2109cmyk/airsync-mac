name: Build AirSync Self Compiled

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project AirSync.xcodeproj \
            -scheme "AirSync Self Compiled" \
            -resolvePackageDependencies

      - name: Archive AirSync
        run: |
          mkdir -p build

          xcodebuild \
            -project AirSync.xcodeproj \
            -scheme "AirSync Self Compiled" \
            -destination "generic/platform=macOS" \
            -archivePath "$PWD/build/AirSync.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Locate app
        run: |
          APP="build/AirSync.xcarchive/Products/Applications/AirSync.app"

          if [ ! -d "$APP" ]; then
            echo "AirSync.app was not produced."
            echo "Archive contents:"
            find build -maxdepth 8 -print
            exit 1
          fi

          echo "Found AirSync.app:"
          ls -la "$APP"

      - name: Ad-hoc sign app
        run: |
          APP="build/AirSync.xcarchive/Products/Applications/AirSync.app"

          echo "Signing nested code..."
          find "$APP" -type f \( \
            -name "*.dylib" -o \
            -name "*.framework" \
          \) -print0 | while IFS= read -r -d '' item; do
            if file "$item" | grep -q "Mach-O"; then
              codesign --force --sign - "$item" || true
            fi
          done

          echo "Signing AirSync.app..."
          codesign \
            --force \
            --deep \
            --sign - \
            "$APP"

      - name: Verify code signature
        run: |
          APP="build/AirSync.xcarchive/Products/Applications/AirSync.app"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP"

          echo "Code signature verification succeeded."

      - name: Upload AirSync.app
        uses: actions/upload-artifact@v4
        with:
          name: AirSync-Self-Compiled
          path: build/AirSync.xcarchive/Products/Applications/AirSync.app
          retention-days: 7
