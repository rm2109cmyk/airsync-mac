name: Build AirSync Self Compiled

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Prepare project for CI
        run: |
          python3 <<'PY'
          from pathlib import Path

          project = Path("AirSync.xcodeproj/project.pbxproj")
          text = project.read_text()

          lines_to_remove = [
              'B99B04C62F641E1400FF3E2D /* AppIcon.icon in Resources */ = {isa = PBXBuildFile; fileRef = B99B04C52F641E1400FF3E2D /* AppIcon.icon */; };',
              'B99B04C52F641E1400FF3E2D /* AppIcon.icon */ = {isa = PBXFileReference; lastKnownFileType = folder.iconcomposer.icon; path = AppIcon.icon; sourceTree = "<group>"; };',
              'B99B04C52F641E1400FF3E2D /* AppIcon.icon */,',
              'B99B04C62F641E1400FF3E2D /* AppIcon.icon in Resources */,',
          ]

          for line in lines_to_remove:
              text = text.replace("\t" + line + "\n", "")
              text = text.replace(line + "\n", "")

          project.write_text(text)
          PY

          echo "Remaining AppIcon.icon references:"
          if grep -n "AppIcon.icon" AirSync.xcodeproj/project.pbxproj; then
            true
          else
            echo "None"
          fi

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project AirSync.xcodeproj \
            -scheme "AirSync Self Compiled" \
            -resolvePackageDependencies

      - name: Archive AirSync
        run: |
          mkdir -p build

          xcodebuild \
            -project AirSync.xcodeproj \
            -scheme "AirSync Self Compiled" \
            -destination "generic/platform=macOS" \
            -archivePath "$PWD/build/AirSync.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ASSETCATALOG_COMPILER_APPICON_NAME=

      - name: Locate app
        run: |
          APP="build/AirSync.xcarchive/Products/Applications/AirSync.app"

          if [ ! -d "$APP" ]; then
            echo "AirSync.app was not produced."
            echo "Archive contents:"
            find build -maxdepth 8 -print
            exit 1
          fi

          echo "Found AirSync.app:"
          ls -la "$APP"

      - name: Ad-hoc sign AirSync
        run: |
          APP="build/AirSync.xcarchive/Products/Applications/AirSync.app"

          echo "Signing AirSync.app ad-hoc..."
          codesign \
            --force \
            --deep \
            --sign - \
            "$APP"

      - name: Verify code signature
        run: |
          APP="build/AirSync.xcarchive/Products/Applications/AirSync.app"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP"

          echo "Code signature verification succeeded."

      - name: Package app
        run: |
          cd build/AirSync.xcarchive/Products/Applications
          ditto -c -k --keepParent AirSync.app "$GITHUB_WORKSPACE/build/AirSync-Self-Compiled.zip"

      - name: Upload AirSync
        uses: actions/upload-artifact@v4
        with:
          name: AirSync-Self-Compiled
          path: build/AirSync-Self-Compiled.zip
          retention-days: 7
