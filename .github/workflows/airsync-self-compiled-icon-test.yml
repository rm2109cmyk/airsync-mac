name: Build AirSync Self Compiled - Icon Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install Metal Toolchain
        run: |
          echo "Installing Metal Toolchain..."
          xcodebuild -downloadComponent metalToolchain

          echo "Verifying Metal Toolchain..."
          xcrun --find metal
          xcrun metal --version

      - name: Verify AppIcon.icon is present
        run: |
          if [ ! -d "AppIcon.icon" ]; then
            echo "ERROR: AppIcon.icon directory was not found."
            exit 1
          fi

          echo "AppIcon.icon contents:"
          find "AppIcon.icon" -maxdepth 2 -print

          echo
          echo "AppIcon.icon/icon.json:"
          cat "AppIcon.icon/icon.json"

      - name: Verify deployment targets
        run: |
          echo "Deployment target references:"
          grep -n "MACOSX_DEPLOYMENT_TARGET" \
            AirSync.xcodeproj/project.pbxproj || true

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project AirSync.xcodeproj \
            -scheme "AirSync Self Compiled" \
            -resolvePackageDependencies

      - name: Archive AirSync
        run: |
          mkdir -p build

          xcodebuild \
            -project AirSync.xcodeproj \
            -scheme "AirSync Self Compiled" \
            -destination "generic/platform=macOS" \
            -archivePath "$PWD/build/AirSync.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ASSETCATALOG_COMPILER_APPICON_NAME=

      - name: Locate app
        run: |
          APP="build/AirSync.xcarchive/Products/Applications/AirSync.app"

          if [ ! -d "$APP" ]; then
            echo "AirSync.app was not produced."
            echo "Archive contents:"
            find build -maxdepth 8 -print
            exit 1
          fi

          echo "Found AirSync.app:"
          ls -la "$APP"

      - name: Ad-hoc sign AirSync
        run: |
          APP="build/AirSync.xcarchive/Products/Applications/AirSync.app"

          echo "Signing AirSync.app ad-hoc..."
          codesign \
            --force \
            --deep \
            --sign - \
            "$APP"

      - name: Verify code signature
        run: |
          APP="build/AirSync.xcarchive/Products/Applications/AirSync.app"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP"

          echo "Code signature verification succeeded."

      - name: Package app
        run: |
          cd build/AirSync.xcarchive/Products/Applications

          ditto \
            -c \
            -k \
            --keepParent \
            AirSync.app \
            "$GITHUB_WORKSPACE/build/AirSync-Self-Compiled-Icon-Test.zip"

      - name: Upload AirSync
        uses: actions/upload-artifact@v4
        with:
          name: AirSync-Self-Compiled-Icon-Test
          path: build/AirSync-Self-Compiled-Icon-Test.zip
          retention-days: 7
