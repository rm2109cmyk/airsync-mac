name: Build AirSync Self Compiled - Icon Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Verify AppIcon.icon structure
        run: |
          echo "=== Verifying icon structure before build ==="
          
          if [ ! -f "AppIcon.icon/icon.json" ]; then
            echo "ERROR: AppIcon.icon/icon.json not found"
            exit 1
          fi
          
          echo "icon.json exists and contains:"
          head -20 AppIcon.icon/icon.json
          
          echo
          echo "SVG assets:"
          ls -lh "AppIcon.icon/Assets/"*.svg

      - name: Verify build configuration deployment target
        run: |
          echo "=== Checking deployment target in project.pbxproj ==="
          
          # This is a verification step - the project.pbxproj should have been updated locally
          grep "MACOSX_DEPLOYMENT_TARGET = 15" AirSync.xcodeproj/project.pbxproj && \
            echo "✓ Deployment target is set to 15" || \
            (echo "ERROR: Deployment target is NOT 15. Has project.pbxproj been updated?" && exit 1)

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project AirSync.xcodeproj \
            -scheme "AirSync Self Compiled" \
            -resolvePackageDependencies

      - name: Archive AirSync with icon
        run: |
          mkdir -p build

          xcodebuild \
            -project AirSync.xcodeproj \
            -scheme "AirSync Self Compiled" \
            -destination "generic/platform=macOS" \
            -archivePath "$PWD/build/AirSync.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Locate app
        run: |
          APP="build/AirSync.xcarchive/Products/Applications/AirSync.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: AirSync.app was not produced."
            echo "Archive contents:"
            find build -maxdepth 8 -print
            exit 1
          fi

          echo "✓ Found AirSync.app"
          ls -la "$APP"

      - name: Inspect icon output
        run: |
          APP="build/AirSync.xcarchive/Products/Applications/AirSync.app"

          echo "=== App Contents Structure ==="
          find "$APP/Contents" -maxdepth 2 -type d | sort

          echo
          echo "=== Resources directory ==="
          if [ -d "$APP/Contents/Resources" ]; then
            ls -lh "$APP/Contents/Resources/" | head -20
          else
            echo "(no Resources directory)"
          fi

          echo
          echo "=== Info.plist icon configuration ==="
          
          if /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$APP/Contents/Info.plist" 2>/dev/null; then
            echo "✓ CFBundleIconName is set"
          else
            echo "  CFBundleIconName not set (expected for .icon format)"
          fi

          if /usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$APP/Contents/Info.plist" 2>/dev/null; then
            echo "✓ CFBundleIconFile is set"
          else
            echo "  CFBundleIconFile not set (expected for .icon format)"
          fi

      - name: Check for AppIcon in app
        run: |
          APP="build/AirSync.xcarchive/Products/Applications/AirSync.app"
          
          echo "=== Checking if icon was processed ==="
          
          # Look for compiled icon files
          find "$APP" -name "*AppIcon*" -o -name "*icon*" | grep -v ".dSYM" | head -20 && \
            echo "✓ Icon-related files found in app" || \
            echo "ℹ No explicitly named icon files (expected - may be embedded)"
          
          echo
          echo "Asset catalogs or compiled resources:"
          find "$APP/Contents/Resources" -name "*.car" -o -name "*.xcassets" 2>/dev/null

      - name: Ad-hoc sign AirSync
        run: |
          APP="build/AirSync.xcarchive/Products/Applications/AirSync.app"

          echo "Signing AirSync.app ad-hoc..."
          codesign \
            --force \
            --deep \
            --sign - \
            "$APP"

      - name: Verify code signature
        run: |
          APP="build/AirSync.xcarchive/Products/Applications/AirSync.app"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP"

          echo "✓ Code signature verification succeeded."

      - name: Package app
        run: |
          cd build/AirSync.xcarchive/Products/Applications

          ditto -c -k --keepParent AirSync.app "$GITHUB_WORKSPACE/build/AirSync-Self-Compiled-Icon.zip"

      - name: Verify package integrity
        run: |
          echo "=== Package contents verification ==="
          unzip -l build/AirSync-Self-Compiled-Icon.zip | head -30
          
          echo
          echo "✓ Package created successfully"
          ls -lh build/AirSync-Self-Compiled-Icon.zip

      - name: Upload AirSync
        uses: actions/upload-artifact@v4
        with:
          name: AirSync-Self-Compiled-Icon
          path: build/AirSync-Self-Compiled-Icon.zip
          retention-days: 7
